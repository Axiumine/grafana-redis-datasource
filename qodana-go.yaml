version: '1.0'

linter: qodana-go

# qodana-go has no Community edition, so every run needs an Ultimate or Ultimate
# Plus licence verified against Qodana Cloud through QODANA_TOKEN.
profile:
  name: qodana.recommended

# Restore the module graph and write the coverage profile inside the linter
# container. GOTOOLCHAIN=auto is Go's own default: if the image ships a Go older
# than the 1.26.8 floor in go.mod it fetches 1.26.8 rather than analysing
# against an older standard library. Qodana finds Go coverage by looking for
# coverage/coverage.out or coverage/cover.out, so the name is not free —
# `mage cover` writes coverage/backend.txt, which Qodana would not see.
#
# GOPATH and GOCACHE have to be redirected first. The linter runs as the
# invoking user rather than as root, while the image bakes in GOPATH=/go and
# GOCACHE=/root/.cache/go-build, both of which that user may not write. Fetching
# the 1.26.8 toolchain then dies on its checksum-database cache with
# `open /go/pkg/sumdb/sum.golang.org/latest: no such file or directory`, the
# bootstrap fails, and no coverage file is written at all — so the coverage gate
# below fails for a reason that has nothing to do with the tests. /data/cache is
# the Qodana cache mount, so the toolchain and the build cache survive between
# runs; the fallback keeps the bootstrap working if the scan is invoked without
# one. GOSUMDB is deliberately left alone: the fix is a writable cache, not a
# weaker supply chain.
bootstrap: |
  CACHE=/data/cache
  [ -w "$CACHE" ] || CACHE=/tmp
  export GOPATH="$CACHE/gopath" GOCACHE="$CACHE/go-build" GOTOOLCHAIN=auto
  mkdir -p "$GOPATH" "$GOCACHE" coverage
  go mod download
  go test ./pkg/... -covermode=atomic -coverprofile=coverage/coverage.out

# The frontend, the build output and the vendored trees are the JavaScript
# linter's job or nobody's. `name: All` means the whole inspection set, and this
# is the syntax the CLI actually parses — a `profile.inspections` list is
# accepted by the YAML reader and then ignored, because Profile carries only
# `name` and `path`.
exclude:
  - name: All
    paths:
      - src
      - dist
      - .qodana
      - node_modules
      - vendor
      - .config
      - coverage

  # main() is the process entry point: it calls datasource.Serve, which blocks
  # until Grafana shuts the plugin down, and then os.Exit. Neither can be driven
  # from a unit test, so the coverage inspection reports the file at 0% on every
  # run. The number is honest and the gate below already accounts for it; what
  # is excluded here is only the per-file inspection, which would otherwise sit
  # at HIGH severity and fail the run for something no test can reach.
  - name: GoCoverageInspection
    paths:
      - pkg/main.go

  # False positive. The inspection reports that the second argument to
  # errors.As must point at a type implementing error, but resp2.Error declares
  # `func (e Error) Error() string` with a value receiver, so resp2.Error does
  # implement error and &redisErr is a valid target. errors.As panics on an
  # invalid one, and errorHandler is covered by tests that pass through this
  # branch, which is the proof it is not.
  - name: GoErrorsAs
    paths:
      - pkg/query.go

  # Duplicated code is the shape of this package rather than a defect in it.
  # Most of the reports are table-driven tests, where the repetition is the test
  # data; the rest are upstream's own query functions — queryXRange, the
  # time-series label parser and the client's command dispatch — which mirror the
  # Redis commands they wrap one for one. Collapsing those into shared helpers
  # would rewrite upstream code for no behavioural gain and put a conflict in the
  # path of every pull request we send back.
  - name: DuplicatedCode
    paths:
      - pkg

  # The three inspections below are style rules, and every path listed under them
  # is a file this fork has never touched. The rule is the same one CLAUDE.md
  # states for the seven files `gofmt -l` flags: our own files must be clean,
  # upstream's are left as upstream wrote them, because restyling them adds noise
  # to every pull request we send back and gains nothing here. Drop a path from
  # this list the moment the fork starts modifying that file for its own reasons.
  - name: GoCommentStart
    paths:
      - pkg/models/custom.go
      - pkg/models/redis-gears.go
      - pkg/models/redis-graph.go
      - pkg/models/redis-search.go
      - pkg/redis-client.go

  - name: GoPreferNilSlice
    paths:
      - pkg/redis-graph.go

  - name: GoRedundantConversion
    paths:
      - pkg/redis-gears_test.go
      - pkg/redis-graph_test.go
      - pkg/redis-json.go
      - pkg/redis-search.go
      - pkg/redis-search_test.go

# Ultimate Plus. The vulnerability checker and the licence audit both run from
# here; raiseLicenseProblems turns a licence violation into an inspection result
# so that it counts against the severity thresholds below rather than sitting in
# a report nobody gates on.
raiseLicenseProblems: true
enablePackageSearch: true

licenseRules:
  - keys:
      - Apache-2.0
    prohibited:
      - GPL-2.0
      - GPL-3.0
      - AGPL-3.0
      - SSPL-1.0

failureConditions:
  severityThresholds:
    critical: 0
    high: 0
  # Measured, not guessed: Qodana counts lines where `go test -cover` counts
  # statements, and a real run reports 99% total. The twelve lines it cannot
  # reach are main() — see the exclusion above — and two tabwriter error
  # branches in queryCustomCommand that a strings.Builder can never trigger,
  # because Builder.Write always reports success. Everything else in pkg/ is
  # covered, so 99 is the floor the tests actually hold, and a regression drops
  # below it. Fresh code has no such excuse and stays at 100.
  testCoverageThresholds:
    total: 99 # whole project
    fresh: 100 # new / changed code
