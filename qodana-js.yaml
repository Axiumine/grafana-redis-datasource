version: '1.0'

linter: qodana-js

# qodana-js has no Community edition either, so this run also needs an Ultimate
# or Ultimate Plus licence verified through QODANA_TOKEN.
profile:
  name: qodana.recommended

# The same install the workflows run, so module resolution matches what CI
# builds against, followed by the single coverage pass. Jest writes
# coverage/lcov.info by default, which is the path Qodana looks for.
bootstrap: |
  yarn install --frozen-lockfile
  yarn test:ci

# The Go backend is the other linter's job, and `name: All` is the whole
# inspection set. See the note in qodana-go.yaml on why this is `exclude` and
# not `profile.inspections`.
exclude:
  - name: All
    paths:
      - pkg
      - dist
      - .qodana
      - node_modules
      - vendor
      - .config
      - coverage

  # Every relative import in src is reported as shortenable, because the scaffolded
  # .config/tsconfig.json maps `"*": ["../src/*"]` and a bare specifier is therefore
  # always shorter. Taking that advice would make the whole frontend depend on a path
  # mapping inside a file `create-plugin update` regenerates and CLAUDE.md forbids
  # editing, and the tree is relative throughout — roughly fifty relative imports
  # against three bare ones. Relative paths resolve without any mapping at all, so
  # they stay.
  - name: ES6PreferShortImport
    paths:
      - src

  # The deprecations are Grafana's own: LegacyForms, Form and FieldArray in
  # @grafana/ui, DataQuery's move to @grafana/schema, and Field.values.toArray. Moving
  # off them is a rewrite of both editors and of the streaming frame, which is its own
  # release rather than a side effect of a lint run. Removing this exclusion is how
  # that work gets found again.
  - name: JSDeprecatedSymbols
    paths:
      - src

  # Duplicated code here is the test data of the configuration editor's table-driven
  # cases, the same judgement qodana-go.yaml records for the backend suites.
  - name: DuplicatedCode
    paths:
      - src

# Ultimate Plus. analyzeDevDependencies widens the vulnerability checker and the
# licence audit to devDependencies, which for a plugin is most of the tree: the
# build toolchain is installed from the same lockfile the release is built with.
raiseLicenseProblems: true
enablePackageSearch: true
analyzeDevDependencies: true

# CC0-1.0 is a public-domain dedication and CC-BY-4.0 asks only for attribution,
# so neither constrains an Apache-2.0 redistribution; both reach the tree through
# build-time data packages — caniuse-lite's browser table, mdn-data, spdx-license-ids,
# string-hash and xml-utils — and none of them is bundled into dist. Listing them is
# what the audit wants: it reports any licence it finds in neither list, so an
# unreviewed one still fails the run.
licenseRules:
  - keys:
      - Apache-2.0
    allowed:
      - CC0-1.0
      - CC-BY-4.0
    prohibited:
      - GPL-2.0
      - GPL-3.0
      - AGPL-3.0
      - SSPL-1.0

failureConditions:
  severityThresholds:
    critical: 0
    high: 0
  testCoverageThresholds:
    total: 100 # whole project
    fresh: 100 # new / changed code
