# RedisGrafana/grafana-redis-datasource at 09df07a. See NOTICE and CHANGELOG.md.

version: '3.4'

services:
  redis:
    image: redis/redis-stack-server
    ports:
      - '6379:6379'
    volumes:
      - '../data:/data/:rw'

  grafana:
    container_name: grafana
    image: grafana/grafana:master
    ports:
      - '3854:3000'
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_ENABLE_GZIP=true
      - GF_USERS_DEFAULT_THEME=light
      # Grafana compares a plugin signature's rootUrls against this value, not against
      # the address in the browser, so the published port has to be named here.
      - GF_SERVER_ROOT_URL=http://localhost:3854/
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=axiumine-redis-datasource
      # Uncomment to run in debug mode
      # - GF_LOG_LEVEL=debug
    volumes:
      - ../dist:/var/lib/grafana/plugins/axiumine-redis-datasource
      - ../provisioning:/etc/grafana/provisioning
      # Uncomment to preserve Grafana configuration
      # - ./data:/var/lib/grafana
