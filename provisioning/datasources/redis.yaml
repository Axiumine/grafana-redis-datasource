apiVersion: 1

datasources:
  - name: Redis
    type: axiumine-redis-datasource
    access: proxy
    isDefault: true
    orgId: 1
    version: 1
    url: redis://host.docker.internal:6379
    jsonData:
      poolSize: 5
      timeout: 10
      pingInterval: 0
      pipelineWindow: 0
    editable: true
