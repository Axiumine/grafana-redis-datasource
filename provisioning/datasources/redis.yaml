# Modified in 2026 by Axiumine, from the original in
# RedisGrafana/grafana-redis-datasource at 09df07a. See NOTICE and CHANGELOG.md.

apiVersion: 1

datasources:
  - name: Redis
    type: axiumine-redis-datasource
    access: proxy
    isDefault: true
    orgId: 1
    version: 1
    # The Redis service of the Compose file that mounts this directory. The
    # original named host.docker.internal, which only Docker Desktop resolves.
    url: redis://redis:6379
    jsonData:
      poolSize: 5
      timeout: 10
      pingInterval: 0
      pipelineWindow: 0
    editable: true
