# Modified in 2026 by Axiumine, from the original in
# RedisGrafana/grafana-redis-datasource at 09df07a. See NOTICE and CHANGELOG.md.

apiVersion: 1

# Grafana lists a datasource by the name given here, so an instance holding this
# fork and the catalogue build showed two entries called Redis with nothing to
# separate them, exactly as the plugin card did. deleteDatasources removes the one
# provisioned under the old name, so a stack that already ran this file is renamed
# rather than left with both.
deleteDatasources:
  - name: Redis
    orgId: 1

datasources:
  - name: Redis (Axiumine)
    type: axiumine-redis-datasource
    access: proxy
    isDefault: true
    orgId: 1
    version: 1
    # The Redis service of the Compose file that mounts this directory. The
    # original named host.docker.internal, which only Docker Desktop resolves.
    url: redis://redis:6379
    jsonData:
      poolSize: 5
      timeout: 10
      pingInterval: 0
      pipelineWindow: 0
    editable: true
