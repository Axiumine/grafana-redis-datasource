# Modified in 2026 by Axiumine, from the original in
# RedisGrafana/grafana-redis-datasource at 09df07a. See NOTICE and CHANGELOG.md.

version: '3.4'

services:
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - '6379:6379'

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - '3854:3000'
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_ENABLE_GZIP=true
      - GF_USERS_DEFAULT_THEME=light
      - GF_DEFAULT_APP_MODE=development
      # Grafana compares a plugin signature's rootUrls against this value, not against
      # the address in the browser, so the published port has to be named here.
      - GF_SERVER_ROOT_URL=http://localhost:3854/
      # The fork is not in Grafana's catalogue, so there is nothing for
      # GF_INSTALL_PLUGINS to fetch: the local build is mounted instead, and an
      # unsigned dist/ needs naming here to be loaded at all.
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=axiumine-redis-datasource
    volumes:
      - ./dist:/var/lib/grafana/plugins/axiumine-redis-datasource
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources
      # Uncomment to preserve Grafana configuration
      # - ./data:/var/lib/grafana
