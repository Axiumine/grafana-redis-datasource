# Modified in 2026 by Axiumine, from the original in
# RedisGrafana/grafana-redis-datasource at 09df07a. See NOTICE and CHANGELOG.md.

name: Integration

on:
  schedule:
    - cron: '0 1 * * *' # run at 1 AM UTC

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      # The self-hosted runners have no Yarn, which setup-node needs for
      # cache: yarn, so the cache is dropped and the runners keep Yarn's own
      # between runs. Corepack ships with Node 24 and provides Yarn.
      - name: Enable Yarn
        run: corepack enable yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check types
        run: yarn typecheck

      - name: Lint frontend
        run: yarn lint

      - name: Test frontend
        run: yarn test:ci

      - name: Build frontend
        run: yarn build

      - name: Check for backend
        id: check-for-backend
        run: |
          if [ -f "Magefile.go" ]
          then
            echo "has-backend=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go environment
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Test backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@6f50bbb8ea47d56e62dee92392788acbc8192d0b # v3.1.0
        with:
          version: latest
          cache-binary: false
          args: cover

      - name: Build backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@6f50bbb8ea47d56e62dee92392788acbc8192d0b # v3.1.0
        with:
          version: latest
          cache-binary: false
          args: buildAll

      - name: Run integration tests
        uses: magefile/mage-action@6f50bbb8ea47d56e62dee92392788acbc8192d0b # v3.1.0
        with:
          version: latest
          cache-binary: false
          args: integration

      - name: Run cluster integration tests
        uses: magefile/mage-action@6f50bbb8ea47d56e62dee92392788acbc8192d0b # v3.1.0
        with:
          version: latest
          cache-binary: false
          args: cluster

      # The compose files publish Redis on host ports 6379 to 6381 and 63790 and
      # leave their containers running, which a GitHub-hosted runner discards with
      # its VM and a persistent server does not.
      - name: Remove the compose environments
        if: always()
        run: |
          docker compose -f docker-compose/cluster.yml down -v --remove-orphans
          docker compose -f docker-compose/test.yml -p grd-integration down -v --remove-orphans
