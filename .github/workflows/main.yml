# Modified in 2026 by Axiumine, from the original in
# RedisGrafana/grafana-redis-datasource at 09df07a. See NOTICE and CHANGELOG.md.

name: Release

on:
  push:
    tags:
      - "v*.*.*" # Run workflow on version tags, e.g. v1.0.0.

permissions:
  contents: read

jobs:
  release:
    runs-on: [self-hosted, Linux, X64]

    # contents: write attaches the assets to the draft release, id-token: write
    # lets cosign and the attestation obtain a keyless signing certificate from
    # the workflow's OIDC identity, and attestations: write stores the build
    # provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      # The self-hosted runners have no Yarn, which setup-node needs for
      # cache: yarn, so the cache is dropped and the runners keep Yarn's own
      # between runs. Corepack ships with Node 24 and provides Yarn.
      - name: Enable Yarn
        run: corepack enable yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check types
        run: yarn typecheck

      - name: Lint frontend
        run: yarn lint

      - name: Test frontend
        run: yarn test:ci

      - name: Build frontend
        run: yarn build

      - name: Check for backend
        id: check-for-backend
        run: |
          if [ -f "Magefile.go" ]
          then
            echo "has-backend=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go environment
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Test backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@6f50bbb8ea47d56e62dee92392788acbc8192d0b # v3.1.0
        with:
          version: latest
          cache-binary: false
          args: cover

      - name: Build backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@6f50bbb8ea47d56e62dee92392788acbc8192d0b # v3.1.0
        with:
          version: latest
          cache-binary: false
          args: buildAll

      - name: Scan backend for known vulnerabilities
        if: steps.check-for-backend.outputs.has-backend == 'true'
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./pkg/...

      # This fork is not in Grafana's catalogue, so the access policy issues a
      # private signature, which is bound to the instances allowed to load the
      # plugin. Without --rootUrls the signing service answers 409
      # InvalidArgument, Field is required: rootUrls, so both inputs are
      # checked before the call rather than after it. The token is a secret;
      # the root URLs are not, and live in a repository variable so that this
      # public workflow does not carry the list.
      - name: Sign plugin
        run: |
          if [ -z "$GRAFANA_ACCESS_POLICY_TOKEN" ]; then
            printf "\033[0;31mGRAFANA_ACCESS_POLICY_TOKEN is not set. Add it as a repository secret.\033[0m\n"
            exit 1
          fi
          if [ -z "$GRAFANA_PLUGIN_ROOT_URLS" ]; then
            printf "\033[0;31mGRAFANA_PLUGIN_ROOT_URLS is not set. Add it as a repository variable, comma separated, each entry matching an instance root_url exactly.\033[0m\n"
            exit 1
          fi
          yarn sign --rootUrls "$GRAFANA_PLUGIN_ROOT_URLS"
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }} # Requires a Grafana Access Policy token from Grafana.com.
          GRAFANA_PLUGIN_ROOT_URLS: ${{ vars.GRAFANA_PLUGIN_ROOT_URLS }}

      - name: Get plugin metadata
        id: metadata
        run: |
          export GRAFANA_PLUGIN_ID=$(cat dist/plugin.json | jq -r .id)
          export GRAFANA_PLUGIN_VERSION=$(cat dist/plugin.json | jq -r .info.version)
          export GRAFANA_PLUGIN_TYPE=$(cat dist/plugin.json | jq -r .type)
          export GRAFANA_PLUGIN_ARTIFACT=${GRAFANA_PLUGIN_ID}-${GRAFANA_PLUGIN_VERSION}.zip
          export GRAFANA_PLUGIN_ARTIFACT_CHECKSUM=${GRAFANA_PLUGIN_ARTIFACT}.md5
          export GRAFANA_PLUGIN_ARTIFACT_SHA1=${GRAFANA_PLUGIN_ARTIFACT}.sha1

          {
            echo "plugin-id=${GRAFANA_PLUGIN_ID}"
            echo "plugin-version=${GRAFANA_PLUGIN_VERSION}"
            echo "plugin-type=${GRAFANA_PLUGIN_TYPE}"
            echo "archive=${GRAFANA_PLUGIN_ARTIFACT}"
            echo "archive-checksum=${GRAFANA_PLUGIN_ARTIFACT_CHECKSUM}"
            echo "archive-sha1=${GRAFANA_PLUGIN_ARTIFACT_SHA1}"
            echo "github-tag=${GITHUB_REF#refs/*/}"
          } >> "$GITHUB_OUTPUT"

      - name: Read changelog
        id: changelog
        run: |
          awk -v tag="## [${{ steps.metadata.outputs.plugin-version }}]" '
            index($0, tag) == 1 { found = 1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            printf "\033[0;31mNo CHANGELOG section for ${{ steps.metadata.outputs.plugin-version }}\033[0m\n"
            exit 1
          fi
          echo "path=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Check package version
        run: if [ "v${{ steps.metadata.outputs.plugin-version }}" != "${{ steps.metadata.outputs.github-tag }}" ]; then printf "\033[0;31mPlugin version doesn't match tag name\033[0m\n"; exit 1; fi

      - name: Package plugin
        id: package-plugin
        run: |
          mv dist ${{ steps.metadata.outputs.plugin-id }}
          zip ${{ steps.metadata.outputs.archive }} ${{ steps.metadata.outputs.plugin-id }} -r
          md5sum ${{ steps.metadata.outputs.archive }} > ${{ steps.metadata.outputs.archive-checksum }}
          sha1sum ${{ steps.metadata.outputs.archive }} > ${{ steps.metadata.outputs.archive-sha1 }}
          echo "checksum=$(cut -d' ' -f1 < ./${{ steps.metadata.outputs.archive-checksum }})" >> "$GITHUB_OUTPUT"
          echo "sha1=$(cut -d' ' -f1 < ./${{ steps.metadata.outputs.archive-sha1 }})" >> "$GITHUB_OUTPUT"

      # The zip is what users install, so it is what gets signed. Keyless: the
      # certificate binds the signature to this workflow and tag, and the
      # bundle carries the Rekor inclusion proof, so verifying needs no key.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign package
        run: cosign sign-blob --yes --bundle "${{ steps.metadata.outputs.archive }}.sigstore.json" "${{ steps.metadata.outputs.archive }}"

      # A gate, not a report. Without -sourceCodeUri the validator never reads
      # yarn.lock and its osv-scanner does not run at all, which is how v3.0.0
      # shipped with a high-severity finding the catalogue then rejected. The
      # private-signature warning is expected until the community signature
      # exists, and a warning does not fail the step.
      #
      # It runs from the catalogue's Docker image because the runner has none
      # of gosec, semgrep, govulncheck or clamscan on its PATH, and the
      # validator skips a pass without a word when its tool is missing. The
      # source is exported from git rather than mounted from the workspace,
      # because clamscan alone spends over six minutes on node_modules. Do not
      # add -strict: it turns the private-signature warning into a failure.
      #
      # The validator reports a gosec finding as a warning, and a warning does not
      # fail it. The one it prints here is G402 on the opt-in TLS skip-verify
      # setting in pkg/redis-client.go, which carries a #nosec annotation with
      # its reason. The image now runs gosec with -nosec, which ignores that
      # annotation, so the finding appears on every run. It is deliberately not
      # promoted to an error: that would keep CI red on code that is intended.
      - name: Validate plugin
        run: |
          src=$(mktemp -d)
          trap 'rm -rf "$src"' EXIT
          git archive HEAD | tar -x -C "$src"
          docker run --rm --pull=always \
            -v "$GITHUB_WORKSPACE/${{ steps.metadata.outputs.archive }}:/archive.zip:ro" \
            -v "$src:/source_code:ro" \
            grafana/plugin-validator-cli -sourceCodeUri file:///source_code /archive.zip

      # Build provenance for the zip: a signed in-toto SLSA statement that names
      # this repository, workflow, tag and commit. It comes from a SHA-pinned
      # action and not from the SLSA generator's reusable workflow, which can
      # only be called by tag and so counts as an unpinned dependency. The bundle
      # is attached as *.intoto.jsonl, the name Scorecard looks for, and is
      # checked with gh attestation verify --bundle.
      - name: Attest provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.metadata.outputs.archive }}

      - name: Name the provenance bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" "${{ steps.metadata.outputs.archive }}.intoto.jsonl"

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Release ${{ steps.metadata.outputs.github-tag }}
          body_path: ${{ steps.changelog.outputs.path }}
          draft: true
          files: |
            ./${{ steps.metadata.outputs.archive }}
            ./${{ steps.metadata.outputs.archive-checksum }}
            ./${{ steps.metadata.outputs.archive-sha1 }}
            ./${{ steps.metadata.outputs.archive }}.sigstore.json
            ./${{ steps.metadata.outputs.archive }}.intoto.jsonl
