name: Scorecard

# Publishes the OpenSSF Scorecard result to scorecard.dev, where the README badge
# reads it. The action only publishes from the default branch, and it does not
# support a repository GitHub marks as a fork, which this one is until it is
# detached from the upstream network.
on:
  branch_protection_rule:
  schedule:
    - cron: '20 7 * * 2'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest

    permissions:
      security-events: write # Upload the SARIF result to code scanning.
      id-token: write # Publish the result to scorecard.dev.

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The default token cannot read branch protection settings, so without a
      # SCORECARD_TOKEN secret (a read-only PAT, see the action's README) the
      # Branch-Protection check reports what the token can see and no more.
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          publish_results: true

      - name: Upload result as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload result to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
