# Modified in 2026 by Axiumine, from the original in
# RedisGrafana/grafana-redis-datasource at 09df07a. See NOTICE and CHANGELOG.md.

name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]

    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      # The self-hosted runners have no Yarn, which setup-node needs for
      # cache: yarn, so the cache is dropped and the runners keep Yarn's own
      # between runs. Corepack ships with Node 24 and provides Yarn.
      - name: Enable Yarn
        run: corepack enable yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check types
        run: yarn typecheck

      - name: Lint frontend
        run: yarn lint

      - name: Test frontend
        run: yarn test:ci

      - name: Build frontend
        run: yarn build

      - name: Check for backend
        id: check-for-backend
        run: |
          if [ -f "Magefile.go" ]
          then
            echo "has-backend=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go environment
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Test backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@6f50bbb8ea47d56e62dee92392788acbc8192d0b # v3.1.0
        with:
          version: latest
          args: cover

      - name: Build backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@6f50bbb8ea47d56e62dee92392788acbc8192d0b # v3.1.0
        with:
          version: latest
          args: buildAll

      - name: Scan backend for known vulnerabilities
        if: steps.check-for-backend.outputs.has-backend == 'true'
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./pkg/...

      # The catalogue's own validator, run on an unsigned archive of this build
      # with the source tree beside it. The source is what lets its osv-scanner
      # read yarn.lock and go.mod; it filters out what Grafana supplies at
      # runtime, so it fails on what the catalogue would reject and nothing
      # else. The unsigned-plugin warning is expected here and does not fail.
      #
      # It runs from the catalogue's Docker image because the runner has none
      # of gosec, semgrep, govulncheck or clamscan on its PATH, and the
      # validator skips a pass without a word when its tool is missing. Under
      # npx the gosec pass never ran here, which is how the G402 finding the
      # catalogue reported on v3.1.0 got through. The source is exported from
      # git rather than mounted from the workspace, because clamscan alone
      # spends over six minutes on node_modules and the catalogue reads the
      # repository, not a build tree.
      #
      # The validator reports a gosec finding as a warning, and a warning does not
      # fail it. The one it prints here is G402 on the opt-in TLS skip-verify
      # setting in pkg/redis-client.go, which carries a #nosec annotation with
      # its reason. The image now runs gosec with -nosec, which ignores that
      # annotation, so the finding appears on every run. It is deliberately not
      # promoted to an error: that would keep CI red on code that is intended.
      - name: Validate plugin
        run: |
          plugin_id=$(jq -r .id dist/plugin.json)
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cp -r dist "$work/$plugin_id"
          find "$work/$plugin_id" -maxdepth 1 -type f -name "${plugin_id}_*" -exec chmod 0755 {} +
          (cd "$work" && zip -qr plugin.zip "$plugin_id")
          mkdir "$work/src"
          git archive HEAD | tar -x -C "$work/src"
          docker run --rm --pull=always \
            -v "$work/plugin.zip:/archive.zip:ro" \
            -v "$work/src:/source_code:ro" \
            grafana/plugin-validator-cli -sourceCodeUri file:///source_code /archive.zip

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          directory: ./coverage/
          files: ./coverage/lcov.info,./coverage/backend.txt
          fail_ci_if_error: true
