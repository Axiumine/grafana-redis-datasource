name: Qodana

on: [push, pull_request]

permissions:
  contents: read

jobs:
  # One Qodana run analyses one linter image, so the Go backend and the
  # TypeScript frontend need a job each. Neither qodana-go nor qodana-js has a
  # Community edition, so both jobs skip themselves when QODANA_TOKEN is unset,
  # the same way the Codecov step in ci.yml skips without CODECOV_TOKEN.
  backend:
    runs-on: ubuntu-latest

    # Uploading SARIF is the only write; the rest of the workflow stays read-only.
    permissions:
      contents: read
      security-events: write

    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Qodana reads history to attribute problems to commits.

      - name: Scan backend
        if: env.QODANA_TOKEN != ''
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          args: --config,qodana-go.yaml
          primary-cache-key: qodana-go-${{ github.ref }}-${{ github.sha }}
          additional-cache-key: qodana-go-${{ github.ref }}

      # always(), because the scan step exits non-zero as soon as a
      # failureConditions threshold is breached. Without it a failed quality
      # gate would withhold the very findings that explain the failure.
      - name: Upload backend results to code scanning
        if: always() && env.QODANA_TOKEN != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          category: qodana-go

  frontend:
    runs-on: ubuntu-latest

    # Uploading SARIF is the only write; the rest of the workflow stays read-only.
    permissions:
      contents: read
      security-events: write

    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Scan frontend
        if: env.QODANA_TOKEN != ''
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          args: --config,qodana-js.yaml
          primary-cache-key: qodana-js-${{ github.ref }}-${{ github.sha }}
          additional-cache-key: qodana-js-${{ github.ref }}

      - name: Upload frontend results to code scanning
        if: always() && env.QODANA_TOKEN != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          category: qodana-js
